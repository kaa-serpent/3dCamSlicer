name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Linux UI libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install
        run: uv sync --locked --extra dev --extra ui

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYVISTA_OFF_SCREEN: "true"
        run: uv run --frozen pytest

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Mypy
        run: uv run --frozen mypy src/rotarycam
