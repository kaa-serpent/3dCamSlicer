[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rotarycam"
version = "0.1.0"
description = "Four-axis CNC toolpath generator around the X axis"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.8",
    "scipy>=1.14",
    "trimesh>=4.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
ui = [
    "PySide6>=6.8",
    "pyvista>=0.45",
    "pyvistaqt>=0.11",
]
performance = [
    "embreex>=2.17",
    "numba>=0.61",
]

[project.scripts]
rotarycam = "rotarycam.cli:app"
rotarycam-gui = "rotarycam.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rotarycam"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/rotarycam"]
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["trimesh", "trimesh.*"]
ignore_missing_imports = true
